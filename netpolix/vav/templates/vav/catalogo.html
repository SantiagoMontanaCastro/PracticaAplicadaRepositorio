{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Videos</title>
    <link rel="stylesheet" href="{% static 'css/style_catalogo.css' %}">
</head>

<body>

    <header class="header">
        <img src="{% static 'images/Logo_Netpolix.png' %}" alt="Icono de Netpolix" class="icono">

        {% if user.is_authenticated %}
        <a href="{% url 'logout' %}" class="logout-btn">Cerrar sesión</a>
        {% endif %}

    </header>

    <h1>Catálogo de Videos</h1>

    <div class="search-container">
        <form method="GET">
            <input type="text" name="titulo_original" placeholder="Buscar por título" />
            <input type="number" name="ano" placeholder="Año" />
            <input type="text" name="idioma_original" placeholder="Idioma" />
            <button type="submit">Buscar</button>
        </form>
    </div>

    <div class="catalogo">
        {% for video in videos %}
        <div class="tarjeta-pelicula" data-url="{% url 'alquilar_venta' video.id %}">
            <div class="poster-container">
                {% if video.poster %}
                <img src="{{ video.poster.url }}" alt="Portada de {{ video.titulo_original }}" class="poster" />
                {% else %}
                <img src="{% static 'images/default_image.png' %}" alt="Imagen por defecto" class="poster" />
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

    <script>

        document.querySelectorAll('.tarjeta-pelicula').forEach(tarjeta => {
            tarjeta.addEventListener('click', function () {
                const url = this.getAttribute('data-url');
                if (url) {
                    window.location.href = url; // Navega a la URL asociada a la tarjeta.
                }
            });
        });
    </script>

</body>

</html>
